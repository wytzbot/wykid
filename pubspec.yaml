name: writing_kids
description: Offline-first handwriting and learning game for children.
publish_to: "none"
version: 1.1.0+3
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.0
  firebase_core: ^4.1.0
  firebase_auth: ^6.1.0
  firebase_messaging: ^16.0.2
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/data/
    - assets/images/
